name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly at 06:17 UTC. Every job below runs on this trigger too — none of them is gated on the
    # event — so the nightly is a full re-run of the hermetic suites against whatever the ecosystem
    # resolves to today. That is the part that rots between releases: pnpm is frozen-lockfile, but
    # the Python install pulls unpinned transitive dependencies, and a break there should surface on
    # a schedule rather than at the next tag.
    #
    # There is deliberately no job here that talks to a real server. This repository has one secret
    # (NPM_TOKEN); there is no staging deployment, and pointing a nightly at production would write
    # test sources, receipts and outcome reports into the live product every night. The real
    # client↔server contract test belongs in the private repo's CI, where both halves exist.
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  js:
    name: JS clients (build · lint · typecheck · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release workflow (v* tag → npm + mcp + pypi)
        run: node scripts/check-release-workflow.mjs
      - name: Front-door docs match the shipped clients
        run: pnpm run check:docs
      # `check` builds first (@usekaval/kaval before @usekaval/mcp, topological) so the MCP typecheck/test resolve
      # the `@usekaval/kaval` types/runtime, then lints, typechecks, and tests.
      - name: Build, lint, typecheck, test
        run: pnpm run check

  node18:
    name: Node SDK (Node 18 compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build + test + ESM smoke
        run: |
          pnpm --filter @usekaval/kaval run build
          pnpm --filter @usekaval/kaval run test
          node sdks/node/test/node18-smoke.mjs

  python:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # `pyproject.toml` declares `requires-python = ">=3.10"`, so the floor is a published promise.
      # Testing only the newest interpreter makes that promise unverified — pip will happily install
      # the wheel on 3.10 and the first syntax or stdlib gap surfaces at the customer.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install \
            "build==1.5.0" \
            "pydantic-ai==2.13.0" \
            "pyright==1.1.411" \
            "twine==6.2.0" \
            -e ".[dev,pydantic-ai]"
      - name: Test and typecheck
        run: |
          pytest
          pyright --warnings
      # One interpreter is enough to inspect the artifact: the wheel is pure-Python and version-
      # independent, so building it on both legs would only assert the same bytes twice.
      - name: Build and inspect publish artifacts
        if: matrix.python-version == '3.13'
        run: |
          python -c 'from pathlib import Path; p = Path("uv.lock"); assert not p.exists(), "uv.lock must remain untracked"; p.write_text("CI exclusion sentinel\n", encoding="utf-8")'
          python -m build
          python -m twine check dist/*
          python scripts/check_dist.py dist
